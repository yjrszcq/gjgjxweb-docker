name: Build and Push Docker Image

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version: latest or a full commit SHA"
        required: true
        default: latest
        type: string
  workflow_call:
    inputs:
      skip_existing:
        description: "Skip when latest already points to the upstream HEAD image"
        type: boolean
        default: false
    secrets:
      DOCKER_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-gjgjxweb-publish
  cancel-in-progress: false

env:
  IMAGE_OWNER: szcq
  IMAGE_NAME: gjgjxweb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream commit
        id: upstream
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          set -euo pipefail
          revision="$VERSION"
          if [[ "$VERSION" == latest ]]; then
            upstream=$(git ls-remote --exit-code https://github.com/CzJam/gjgjxweb.git HEAD)
            read -r revision _ <<< "$upstream"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected latest or a full 40-character lowercase commit SHA.' >&2
            exit 1
          fi
          {
            echo "revision=$revision"
            echo 'tags<<EOF'
            echo "${IMAGE_OWNER}/${IMAGE_NAME}:sha-${revision}"
            if [[ "$VERSION" == latest ]]; then
              echo "${IMAGE_OWNER}/${IMAGE_NAME}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Check for a new upstream revision
        if: inputs.skip_existing
        id: registry
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          manifest_digest() {
            local ref="docker.io/${IMAGE_OWNER}/${IMAGE_NAME}:$1" result
            if result=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref" 2>&1); then
              printf '%s\n' "$result"
            else
              case "$result" in
                *"$ref: not found"*|*"manifest unknown"*) return 0 ;;
                *) printf '%s\n' "$result" >&2; return 1 ;;
              esac
            fi
          }
          published=$(manifest_digest "sha-${REVISION}")
          latest=$(manifest_digest latest)
          if [[ -n "$published" && "$published" == "$latest" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Upstream revision $REVISION is already tagged latest."
          fi
      - name: Check out packaging repository
        if: steps.registry.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build smoke-test image
        if: steps.registry.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: GJGJXWEB_COMMIT=${{ steps.upstream.outputs.revision }}
          tags: gjgjxweb:smoke
      - name: Check web server
        if: steps.registry.outputs.skip != 'true'
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::8080 gjgjxweb:smoke)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          url="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --output /dev/null "$url/"
          mime=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "$url/js/app.js")
          [[ "$mime" == application/javascript* ]]
      - name: Build and push multi-platform image
        if: steps.registry.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GJGJXWEB_COMMIT=${{ steps.upstream.outputs.revision }}
          tags: ${{ steps.upstream.outputs.tags }}
